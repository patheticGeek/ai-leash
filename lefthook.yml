pre-commit:
  commands:
    lint-staged:
      run: >-
        bash -c '
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh";
          [ -s "$HOME/.cargo/env" ] && . "$HOME/.cargo/env";
          npx lint-staged
        '
    rust-clippy:
      glob: "src-tauri/**/*.rs"
      run: >-
        bash -c '
          [ -s "$HOME/.cargo/env" ] && . "$HOME/.cargo/env";
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
        '
