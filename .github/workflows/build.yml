name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          cache: "npm"

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libarchive-tools \
            tar \
            coreutils \
            sed \
            bash

      - name: Install npm dependencies
        run: npm ci

      - name: Bundle macOS dmg
        if: runner.os == 'macOS'
        run: npx tauri build --bundles dmg

      - name: Bundle Linux Debian package
        if: runner.os == 'Linux'
        run: npx tauri build --bundles deb

      - name: Package Arch bin tarball
        if: runner.os == 'Linux'
        run: bash packaging/arch-bin/build-tarball.sh

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p workflow-artifacts
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          COMMIT_HASH="${GITHUB_SHA:0:7}"
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 ;;
            aarch64|arm64) ARCH=aarch64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb \
              "workflow-artifacts/ai-leash_v${VERSION}_${COMMIT_HASH}_${ARCH}.deb"
            cp ai-leash-bin.tar.gz \
              "workflow-artifacts/ai-leash_v${VERSION}_${COMMIT_HASH}_${ARCH}.tar.gz"
          else
            cp src-tauri/target/release/bundle/dmg/*.dmg \
              "workflow-artifacts/ai-leash_v${VERSION}_${COMMIT_HASH}_${ARCH}.dmg"
          fi

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Linux-deb
          path: workflow-artifacts/ai-leash*.deb
          archive: false
          if-no-files-found: error

      - name: Upload Arch tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Linux-tar-gz
          path: workflow-artifacts/ai-leash*.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macOS-dmg
          path: workflow-artifacts/ai-leash*.dmg
          archive: false
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          pattern: Linux-deb
          path: artifacts
          merge-multiple: true

      - name: Download Arch tarball
        uses: actions/download-artifact@v8
        with:
          pattern: Linux-tar-gz
          path: artifacts
          merge-multiple: true

      - name: Download macOS disk image
        uses: actions/download-artifact@v8
        with:
          pattern: macOS-dmg
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-${{ github.run_number }}-$SHORT_SHA"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Build #${{ github.run_number }} ($SHORT_SHA)" \
            --notes "Automated build from commit ${{ github.sha }}. [Install instructions in readme ->](https://github.com/patheticGeek/ai-leash#install)" \
            artifacts/ai-leash_*.deb \
            artifacts/ai-leash_*.tar.gz \
            artifacts/ai-leash_*.dmg
