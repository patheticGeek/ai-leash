name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: "npm"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Bundle macOS dmg
        if: runner.os == 'macOS'
        run: npx tauri build --bundles dmg

      - name: Bundle Linux Debian package
        if: runner.os == 'Linux'
        run: npx tauri build --bundles deb

      - name: Package Arch bin tarball
        if: runner.os == 'Linux'
        run: bash packaging/arch-bin/build-tarball.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: |
            src-tauri/target/release/bundle/dmg
            src-tauri/target/release/bundle/deb
            ai-leash-bin.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-${{ github.run_number }}-$SHORT_SHA"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Build #${{ github.run_number }} ($SHORT_SHA)" \
            --notes "Automated build from commit ${{ github.sha }}." \
            artifacts/Linux-build/deb/*.deb \
            artifacts/Linux-build/ai-leash-bin.tar.gz \
            artifacts/macOS-build/dmg/*.dmg
