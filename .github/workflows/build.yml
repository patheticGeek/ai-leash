name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: arch
            runner: ubuntu-latest
            container: archlinux:latest
    steps:
      - name: Bootstrap Arch runner
        if: matrix.os == 'arch'
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: "npm"
        if: matrix.os != 'arch'

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
        if: matrix.os != 'arch'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'arch'

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Install npm dependencies
        run: npm ci
        if: matrix.os != 'arch'

      - name: Bundle macOS dmg
        if: matrix.os == 'macos'
        run: npx tauri build --bundles dmg

      - name: Bundle Linux Debian package
        if: matrix.os == 'ubuntu'
        run: npx tauri build --bundles deb

      - name: Build Arch package
        if: matrix.os == 'arch'
        run: |
          pacman -S --noconfirm --needed \
            base-devel \
            cargo \
            git \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            npm \
            webkit2gtk-4.1
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg --noconfirm --syncdeps --clean'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os != 'arch'
        with:
          name: ${{ matrix.os }}-build
          path: |
            src-tauri/target/release/bundle/dmg
            src-tauri/target/release/bundle/deb
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="build-${{ github.run_number }}-$SHORT_SHA"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Build #${{ github.run_number }} ($SHORT_SHA)" \
            --notes "Automated build from commit ${{ github.sha }}." \
            artifacts/Linux-build/deb/*.deb \
            artifacts/macOS-build/dmg/*.dmg
